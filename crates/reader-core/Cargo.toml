[package]
name = "reader-core"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
unicode-segmentation = "1.12"
unicode-normalization = "0.1"
whatlang = "0.18.0"
regex = "1"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
flate2 = "1.1"
png = "0.18"
quick-xml = "0.38"
pdf-extract = "0.12.1"
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
sentencepiece-rs = "0.2.2"
tempfile = "3"
llama-cpp-2 = { version = "=0.1.161", default-features = false }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-30", "alternative-backend"] }
libloading = "0.8"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
fsrs = { version = "=6.6.2", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"

[target.'cfg(all(target_vendor = "apple", target_arch = "aarch64"))'.dependencies]
# On Apple Silicon, SHA-256 uses the CPU instructions for streaming model verification.
sha2 = { version = "0.10", features = ["asm"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }
