name: Native reader
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  headless:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build -p reader-ffi --locked
      - run: dotnet build apps/reader-native/Reader.Presentation/Reader.Presentation.csproj --nologo
  catalyst:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1'
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios-macabi
      - run: dotnet workload install maui --version 10.0.100
      - run: cargo build -p reader-ffi --release --locked --target aarch64-apple-ios-macabi
      - run: >-
          dotnet build apps/reader-native/Reader.Native/Reader.Native.csproj
          -f net10.0-maccatalyst -c Release -p:RuntimeIdentifier=maccatalyst-arm64
          -p:EnableCodeSigning=false -p:CreatePackage=false --nologo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalyst-build
          path: apps/reader-native/Reader.Native/bin/Release/net10.0-maccatalyst/
          if-no-files-found: warn
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - run: dotnet workload install maui --version 10.0.100
      - run: cargo build -p reader-ffi --release --locked --target x86_64-pc-windows-msvc
      - run: >-
          dotnet build apps/reader-native/Reader.Native/Reader.Native.csproj
          -f net10.0-windows10.0.19041.0 -c Release -p:RuntimeIdentifier=win-x64 --nologo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build
          path: apps/reader-native/Reader.Native/bin/Release/net10.0-windows10.0.19041.0/
          if-no-files-found: warn
