name: Mac laptop transfer
on:
  push:
    branches: [work/lingo-mac-handoff-50e8b63]
permissions:
  contents: read
jobs:
  catalyst:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 50e8b6375842212da2caa9a4cd268359d9aadb0b
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 10.0.x
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios-macabi
      # Workload 10.0.401 matches the Xcode installed on this runner image.
      - run: dotnet workload install maui-maccatalyst --version 10.0.401
      - name: Build the Mac Catalyst core and llama.cpp
        env:
          CFLAGS_aarch64_apple_ios_macabi: -target arm64-apple-ios15.0-macabi
          CXXFLAGS_aarch64_apple_ios_macabi: -target arm64-apple-ios15.0-macabi
        run: |
          export CMAKE_OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)"
          cargo rustc -p reader-ffi --release --locked --target aarch64-apple-ios-macabi --crate-type staticlib
      - run: >-
          dotnet build apps/reader-native/Reader.Native/Reader.Native.csproj
          -f net10.0-maccatalyst -c Release -p:RuntimeIdentifier=maccatalyst-arm64
          -p:EnableCodeSigning=false -p:CreatePackage=false
          -p:ApplicationId=dev.lingoreader.runtimecheck.50e8b63 --nologo
      - name: Archive isolated app from exact main
        run: |
          output="$RUNNER_TEMP/lingo-transfer"
          mkdir "$output"
          app="$(find apps/reader-native/Reader.Native/bin/Release/net10.0-maccatalyst -type d -name '*.app' -print -quit)"
          test -n "$app"
          picked="$(plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")"
          test "$picked" = dev.lingoreader.runtimecheck.50e8b63
          entitlements="apps/reader-native/Reader.Native/Platforms/MacCatalyst/Entitlements.plist"
          codesign --force --sign - --entitlements "$entitlements" "$app"
          codesign --verify --deep --strict "$app"
          ditto "$app" "$output/Lingo Preview.app"
          ditto -c -k --keepParent "$output/Lingo Preview.app" "$output/lingo-app.zip"
          git rev-parse HEAD > "$output/source-commit.txt"
          cd "$output"
          shasum -a 256 lingo-app.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: lingo-mac-50e8b63-transfer
          path: |
            ${{ runner.temp }}/lingo-transfer/lingo-app.zip
            ${{ runner.temp }}/lingo-transfer/source-commit.txt
            ${{ runner.temp }}/lingo-transfer/SHA256SUMS
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
